<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - CafeHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>body { font-family: 'Poppins', sans-serif; background-color: var(--coffee-dark); }</style>
</head>
<body>

<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div style="max-width:420px; margin: 40px auto 0;">
      {% for category, message in messages %}
        <div class="alert auto-dismiss {% if category == 'error' %}alert-cafe-error{% else %}alert-cafe-success{% endif %} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <div class="login-box">
    <h2 class="text-center mb-1" style="color:var(--coffee-brown); font-weight:800;">Cafe<span style="color:var(--accent);">Hub</span></h2>
    <p class="text-center text-muted mb-4">Admin Panel Login</p>
    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-cafe w-100">Login</button>
    </form>
    <p class="text-center text-muted small mt-4 mb-0">Demo credentials: admin / admin123</p>
    <p class="text-center mt-3"><a href="{{ url_for('index') }}" style="color:var(--coffee-brown);">&larr; Back to Website</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
