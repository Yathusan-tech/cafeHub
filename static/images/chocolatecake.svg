<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgLava" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b2e1e"/>
      <stop offset="50%" stop-color="#3b2214"/>
      <stop offset="100%" stop-color="#2c1a10"/>
    </linearGradient>

    <!-- Warm Glow -->
    <radialGradient id="glowLava" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#d99a44" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6f4e37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2c1a10" stop-opacity="0"/>
    </radialGradient>

    <!-- Dessert Plate Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="70%" stop-color="#ebdcc8"/>
      <stop offset="100%" stop-color="#cca885"/>
    </linearGradient>

    <!-- Cake Texture Gradient -->
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a1e0f"/>
      <stop offset="40%" stop-color="#4e2a16"/>
      <stop offset="100%" stop-color="#241107"/>
    </linearGradient>

    <!-- Molten Lava Fudge Gradient -->
    <radialGradient id="lavaGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#301507"/>
      <stop offset="50%" stop-color="#1e0c03"/>
      <stop offset="100%" stop-color="#0e0401"/>
    </radialGradient>

    <!-- Vanilla Ice Cream Scoop Gradient -->
    <radialGradient id="iceCreamGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fff8eb"/>
      <stop offset="85%" stop-color="#f5e6ce"/>
      <stop offset="100%" stop-color="#e0cbab"/>
    </radialGradient>

    <filter id="shadowLava" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#150b06" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgLava)"/>
  <rect width="400" height="300" rx="16" fill="url(#glowLava)"/>

  <!-- Subtle Rings -->
  <circle cx="200" cy="165" r="135" fill="none" stroke="#d99a44" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="200" cy="165" r="115" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Plate Shadow -->
  <ellipse cx="200" cy="255" rx="125" ry="22" fill="#180c06" opacity="0.7" filter="url(#shadowLava)"/>

  <!-- Ceramic Dessert Plate -->
  <ellipse cx="200" cy="235" rx="122" ry="26" fill="url(#plateGrad)" filter="url(#shadowLava)"/>
  <ellipse cx="200" cy="233" rx="112" ry="21" fill="#fdfbf7"/>
  <ellipse cx="200" cy="233" rx="85" ry="14" fill="#ebdcc8" opacity="0.6"/>

  <!-- Powdered Sugar Dusting on Plate -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="110" cy="230" r="1.5"/>
    <circle cx="125" cy="225" r="1.2"/>
    <circle cx="135" cy="238" r="1.4"/>
    <circle cx="270" cy="228" r="1.6"/>
    <circle cx="285" cy="235" r="1.3"/>
    <circle cx="260" cy="240" r="1.5"/>
  </g>

  <!-- Molten Lava Pool on Plate (Flowing Forward) -->
  <ellipse cx="200" cy="236" rx="68" ry="15" fill="url(#lavaGrad)" filter="url(#shadowLava)"/>
  <path d="M 165 220 C 150 235 175 250 200 248 C 225 250 250 235 235 220 Z" fill="url(#lavaGrad)"/>
  <!-- Molten Gloss Highlights -->
  <path d="M 180 235 Q 200 245 220 236" stroke="#5a2c16" stroke-width="2.5" fill="none" opacity="0.8"/>

  <!-- Chocolate Cake Body -->
  <g filter="url(#shadowLava)">
    <!-- Base Cake Cylinder -->
    <path d="M 148 165 L 140 225 C 140 238 165 244 200 244 C 235 244 260 238 260 225 L 252 165 Z" fill="url(#cakeGrad)"/>
    <!-- Top Cake Crust Rim -->
    <ellipse cx="200" cy="165" rx="52" ry="18" fill="#4a2412"/>
    <ellipse cx="200" cy="165" rx="46" ry="15" fill="#301507"/>

    <!-- Cut/Open Center of Cake showing flowing lava -->
    <path d="M 172 170 C 172 205 180 235 200 238 C 220 235 228 205 228 170 Z" fill="url(#lavaGrad)"/>
    <!-- Flowing Chocolate Stream -->
    <path d="M 185 168 C 182 195 185 228 198 238 C 210 228 215 195 212 168 Z" fill="#180701"/>
    <!-- Molten Liquid Gloss Streak -->
    <path d="M 194 185 L 194 220" stroke="#7a3d1e" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Vanilla Ice Cream Scoop (Resting on Top of Warm Cake) -->
  <g filter="url(#shadowLava)">
    <!-- Base Scoop -->
    <ellipse cx="200" cy="135" rx="38" ry="34" fill="url(#iceCreamGrad)"/>
    <!-- Scoop Texture Ridges -->
    <path d="M 166 142 Q 180 155 200 152 Q 220 155 234 142 Q 238 130 234 118 Q 200 95 166 118 Q 162 130 166 142 Z" fill="url(#iceCreamGrad)"/>
    <!-- Ice Cream Highlight -->
    <ellipse cx="190" cy="122" rx="14" ry="10" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="215" cy="128" rx="8" ry="6" fill="#ffffff" opacity="0.6"/>

    <!-- Vanilla Bean Specks on Ice Cream -->
    <g fill="#4e2c14" opacity="0.6">
      <circle cx="185" cy="118" r="0.8"/>
      <circle cx="195" cy="112" r="0.9"/>
      <circle cx="208" cy="116" r="0.7"/>
      <circle cx="180" cy="132" r="0.9"/>
      <circle cx="198" cy="128" r="0.8"/>
      <circle cx="218" cy="130" r="0.7"/>
      <circle cx="205" cy="138" r="0.8"/>
    </g>

    <!-- Chocolate Drizzle / Flakes on Ice Cream -->
    <path d="M 188 108 Q 195 118 190 128" stroke="#241107" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 204 110 Q 208 122 205 132" stroke="#241107" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="194" y="104" width="4" height="2" fill="#241107" transform="rotate(20 194 104)"/>
    <rect x="206" y="108" width="3.5" height="1.8" fill="#241107" transform="rotate(-30 206 108)"/>
  </g>
</svg>
