<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgMocha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b2e1e"/>
      <stop offset="50%" stop-color="#3b2214"/>
      <stop offset="100%" stop-color="#2c1a10"/>
    </linearGradient>

    <!-- Warm Glow -->
    <radialGradient id="glowMocha" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#d99a44" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6f4e37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2c1a10" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Liquid Gradient -->
    <linearGradient id="mochaLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d2112"/>
      <stop offset="30%" stop-color="#6b4023"/>
      <stop offset="70%" stop-color="#8c5833"/>
      <stop offset="100%" stop-color="#4a2916"/>
    </linearGradient>

    <!-- Whipped Cream Gradient -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff5e6"/>
      <stop offset="100%" stop-color="#ebdcc8"/>
    </linearGradient>

    <!-- Chocolate Drizzle Gradient -->
    <linearGradient id="chocoDrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b1407"/>
      <stop offset="100%" stop-color="#150802"/>
    </linearGradient>

    <filter id="shadowMocha" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#150b06" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgMocha)"/>
  <rect width="400" height="300" rx="16" fill="url(#glowMocha)"/>

  <!-- Subtle Rings -->
  <circle cx="200" cy="165" r="135" fill="none" stroke="#d99a44" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="200" cy="165" r="115" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Glass Shadow -->
  <ellipse cx="200" cy="265" rx="55" ry="12" fill="#180c06" opacity="0.7" filter="url(#shadowMocha)"/>

  <!-- Glass Base -->
  <path d="M 160 260 L 165 240 L 235 240 L 240 260 Z" fill="#ffffff" opacity="0.2"/>

  <!-- Tall Glass Body -->
  <path d="M 162 255 L 145 130 L 255 130 L 238 255 Z" fill="url(#mochaLiquid)" filter="url(#shadowMocha)"/>

  <!-- Milk & Chocolate Swirl Layers inside Glass -->
  <path d="M 152 185 Q 200 200 248 180 L 243 220 Q 195 235 157 220 Z" fill="#b0805c" opacity="0.65"/>
  <path d="M 148 150 Q 200 165 252 148 L 250 170 Q 198 185 150 170 Z" fill="#e6cca8" opacity="0.8"/>
  <path d="M 160 230 Q 200 240 240 230 L 238 255 L 162 255 Z" fill="#241208" opacity="0.9"/>

  <!-- Glass Rim & Highlights -->
  <path d="M 148 135 L 160 250" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 252 135 L 240 250" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.25"/>

  <!-- Whipped Cream Mountain -->
  <g filter="url(#shadowMocha)">
    <!-- Base Cream -->
    <path d="M 140 130 Q 130 115 155 105 Q 170 100 185 108 Q 200 95 220 105 Q 245 98 255 115 Q 265 125 260 130 Z" fill="url(#creamGrad)"/>
    <!-- Middle Swirl -->
    <path d="M 150 110 Q 155 85 180 82 Q 200 75 215 88 Q 235 80 245 102 Z" fill="url(#creamGrad)"/>
    <!-- Top Peak Swirl -->
    <path d="M 170 85 Q 185 55 200 50 Q 215 58 218 82 Z" fill="#ffffff"/>
  </g>

  <!-- Chocolate Sauce Drizzles on Cream -->
  <path d="M 195 50 Q 180 75 165 105 Q 158 120 160 135" fill="none" stroke="url(#chocoDrip)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 200 52 Q 215 78 230 100 Q 242 118 245 135" fill="none" stroke="url(#chocoDrip)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 190 70 Q 202 95 195 125" fill="none" stroke="url(#chocoDrip)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Chocolate Shavings / Sprinkles -->
  <g fill="#241208">
    <rect x="185" y="65" width="4" height="2" transform="rotate(25 185 65)"/>
    <rect x="208" y="70" width="5" height="2.5" transform="rotate(-35 208 70)"/>
    <rect x="175" y="90" width="4.5" height="2" transform="rotate(45 175 90)"/>
    <rect x="220" y="88" width="5" height="2" transform="rotate(-15 220 88)"/>
    <rect x="195" y="95" width="4" height="2" transform="rotate(10 195 95)"/>
    <rect x="160" y="112" width="4" height="2" transform="rotate(-30 160 112)"/>
    <rect x="238" y="110" width="5" height="2" transform="rotate(40 238 110)"/>
  </g>

  <!-- Chocolate Squares on the Table -->
  <!-- Left Chocolate Square -->
  <g transform="translate(85, 250) rotate(-15)" filter="url(#shadowMocha)">
    <rect x="0" y="0" width="28" height="20" rx="3" fill="#3a1e0f"/>
    <rect x="3" y="3" width="22" height="14" rx="2" fill="#251208"/>
  </g>
  <!-- Right Chocolate Square -->
  <g transform="translate(305, 252) rotate(20)" filter="url(#shadowMocha)">
    <rect x="0" y="0" width="26" height="18" rx="3" fill="#3a1e0f"/>
    <rect x="3" y="3" width="20" height="12" rx="2" fill="#251208"/>
  </g>
</svg>
